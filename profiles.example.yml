# Copy to ~/.dbt/profiles.yml (or set DBT_PROFILES_DIR=.) and pick a target.
# Postgres is the reference adapter used in CI; the SQL is adapter-agnostic via
# dbt cross-database macros and the dispatched macros in /macros.
lanternly_metrics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: 5432
      user: "{{ env_var('PGUSER', 'postgres') }}"
      password: "{{ env_var('PGPASSWORD', 'postgres') }}"
      dbname: "{{ env_var('PGDATABASE', 'lanternly') }}"
      schema: dev
      threads: 4
    ci:
      type: postgres
      host: localhost
      port: 5432
      user: postgres
      password: postgres
      dbname: lanternly
      schema: ci
      threads: 4
    duckdb:
      type: duckdb
      path: lanternly.duckdb
      schema: dev
