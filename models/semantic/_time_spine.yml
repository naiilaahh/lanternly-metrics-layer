version: 2

models:
  - name: metricflow_time_spine
    description: Day-grain time spine for MetricFlow (cumulative metrics, offsets). Runs through 2030.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests: [unique, not_null]
